name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# INKTTS auto-update flow:
#   - Win portable: built on windows-latest → portableUpdate.cjs polls /releases/latest API
#                   every 30 min → silent stage + helper-cmd swap on quit
#   - Mac (unsigned dmg): built on macos-latest → same poll → notification-only (user clicks
#                          banner to open releases page; Gatekeeper requires "right-click → Open"
#                          on first launch since we don't sign/notarize)
jobs:
  package-win:
    name: Package Windows portable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version with tag
        shell: bash
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME:-}"
          if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "skip: not a vX.Y.Z tag ($REF)"
            exit 0
          fi
          VERSION="${REF#v}"
          echo "forcing version $VERSION into all package.json"
          for f in package.json .app/shell/package.json; do
            node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('$f','utf8'));j.version='$VERSION';fs.writeFileSync('$f',JSON.stringify(j,null,2)+'\n');"
            echo "  $f -> $(node -e "console.log(require('./$f').version)")"
          done

      - name: Build renderer
        working-directory: .app/shell
        run: pnpm build

      - name: Package Windows portable
        working-directory: .app/shell
        run: pnpm exec electron-builder --win portable --publish never

      - name: Create download alias (latest)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd .app/shell/release
          for f in INKTTS-Portable-*.exe; do cp "$f" INKTTS-Portable-latest.exe; break; done
          ls -la

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            .app/shell/release/INKTTS-Portable-*.exe
            .app/shell/release/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package-mac:
    name: Package macOS dmg
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version with tag
        shell: bash
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME:-}"
          if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "skip: not a vX.Y.Z tag ($REF)"
            exit 0
          fi
          VERSION="${REF#v}"
          echo "forcing version $VERSION into all package.json"
          for f in package.json .app/shell/package.json; do
            node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('$f','utf8'));j.version='$VERSION';fs.writeFileSync('$f',JSON.stringify(j,null,2)+'\n');"
            echo "  $f -> $(node -e "console.log(require('./$f').version)")"
          done

      - name: Build renderer
        working-directory: .app/shell
        run: pnpm build

      - name: Package macOS dmg (unsigned, x64+arm64)
        working-directory: .app/shell
        run: pnpm exec electron-builder --mac dmg --x64 --arm64 --publish never
        env:
          # ปิด code signing — ไม่มี Apple Developer cert
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            .app/shell/release/INKTTS-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
